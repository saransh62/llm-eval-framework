[project]
name = "llm-eval-framework"
version = "0.1.0"
description = "A small RAG Q&A service plus a CI-gated LLM evaluation suite."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
  "anthropic>=0.70",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["app", "evals", "evals.metrics"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = ["eval: full LLM evaluation (needs an API key; run with -m eval)"]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
