# Runtime configuration. Every key can be overridden by the env var shown in brackets.
llm:
  provider: fake            # [LLM_PROVIDER] fake | anthropic | openai
  models:                   # [LLM_MODEL] overrides the model for the chosen provider
    anthropic: claude-opus-5-5
    openai: gpt-4.1-mini
    fake: fake-extractive-v1
  temperature: 0            # [LLM_TEMPERATURE] sent to OpenAI; see README "Assumptions" for Anthropic
  max_tokens: 2048          # [LLM_MAX_TOKENS]
  effort: low               # [LLM_EFFORT] Anthropic output_config.effort

judge:
  provider: null            # [JUDGE_PROVIDER] defaults to llm.provider
  models:                   # [JUDGE_MODEL]
    anthropic: claude-opus-5-5
    openai: gpt-4.1
    fake: fake-judge-v1
  temperature: 0
  max_tokens: 4096
  effort: medium

retrieval:
  top_k: 4                  # [TOP_K]
  chunk_max_chars: 600

# USD per million tokens, used for the cost metric.
pricing:
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  gpt-4.1: {input: 2.00, output: 8.00}
  gpt-4.1-mini: {input: 0.40, output: 1.60}
  fake-extractive-v1: {input: 0.0, output: 0.0}
  fake-judge-v1: {input: 0.0, output: 0.0}
