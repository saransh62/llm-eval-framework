name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Offline tests (FakeLLM, no API key)
        run: pytest -q
      - name: Eval harness smoke run (FakeLLM, 5 questions, report only)
        run: python -m evals.run --provider fake --sample 5 --no-gate --no-cache --out /tmp/eval-smoke
