name: LLM eval

# Manual only (Actions > LLM eval > Run workflow), so no model calls are made without someone asking for them.
on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Questions to run (stratified sample; 50 = full set)"
        default: "50"
      provider:
        description: "LLM provider"
        type: choice
        options: [anthropic, openai]
        default: anthropic
      update_baseline:
        description: "Write this run's metrics as the new baseline (uploaded as an artifact to commit)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: llm-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Full LLM evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: ${{ inputs.provider || vars.EVAL_PROVIDER || 'anthropic' }}
      EVAL_SAMPLE: ${{ inputs.sample_size }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Restore judge cache
        uses: actions/cache@v4
        with:
          path: evals/.cache/judge
          key: judge-${{ hashFiles('evals/judges/*.md') }}-${{ github.run_id }}
          restore-keys: judge-${{ hashFiles('evals/judges/*.md') }}-
      - name: Run evaluation (pytest -m eval wraps the same entry point)
        run: |
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            python -m evals.run --update-baseline
          else
            python -m evals.run
          fi
      - name: Post summary
        if: always()
        run: |
          if [ -f evals/reports/summary.md ]; then
            cat evals/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Eval did not produce a report (missing API key secret?)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_number }}
          path: |
            evals/reports/report.md
            evals/reports/results.json
            evals/baseline.json
          if-no-files-found: warn
